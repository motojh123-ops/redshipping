# ==============================================================================
# Render Blueprint — RED SHIPPING / Banna ERP Backend
# One-click deployment: Render Dashboard → New → Blueprint → select this repo.
# Provisions: PostgreSQL 16 + the NestJS API (build, migrations, seed, health).
# ==============================================================================

services:
  - type: web
    name: banna-redshipping-api
    runtime: node
    plan: free
    region: frankfurt
    # Follows the repository's default branch (main) automatically
    autoDeploy: true
    # Install → generate the Prisma client → build shared-types then the API
    buildCommand: npm ci && npm run -w apps/api db:generate && npx turbo run build --filter=@banna/api
    # Start the API
    startCommand: node apps/api/dist/main.js
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: postgresql://neondb_owner:npg_H1pBuh6KOkeU@ep-still-tooth-b4o9aesp-pooler.c-6.us-east-2.aws.neon.tech/neondb?sslmode=require
      # Auto-generated secrets — no manual setup required
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      # Optional: enable reminder/ACID queues (BullMQ). Uncomment this block AND
      # the keyvalue instance below to activate. Without it the API runs in
      # disabled-queue mode and every other feature keeps working.
      # - key: REDIS_URL
      #   fromService:
      #     type: keyvalue
      #     name: banna-redshipping-redis
      #     property: connectionString
      # Optional live integrations — set from the Render dashboard when the
      # company credentials are available (until then the API answers honestly):
      # - key: ETA_ENV               # sit | production
      # - key: ETA_CLIENT_ID
      # - key: ETA_CLIENT_SECRET
      # - key: WHATSAPP_API_TOKEN
      # - key: WHATSAPP_PHONE_NUMBER_ID
      # Optional: custom frontend domain(s), comma separated, e.g.
      # https://redshipping.com,https://www.redshipping.com
      # - key: ALLOWED_ORIGINS
      #   sync: false

# Optional managed Redis for the reminder queues — uncomment together with the
# REDIS_URL env var above to enable BullMQ (ACID expiry / demurrage alerts).
#  - type: keyvalue
#    name: banna-redshipping-redis
#    plan: free
#    ipAllowList: []
#    # internal only — the API reaches it over the private network
