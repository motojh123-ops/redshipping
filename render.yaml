# ==============================================================================
# Render Blueprint — RED SHIPPING / Banna ERP Backend
# Architecture: Render free web service (API) + Neon free PostgreSQL —
# BOTH never expire, unlike Render's own free Postgres (deleted after 30 days).
#
# One-click deploy: Render Dashboard → New → Blueprint → select this repo → Apply.
# You will be prompted ONCE for the two Neon connection strings (sync: false
# keeps the credentials out of this public repository).
#
# ⚠ SECURITY: a Neon password was previously committed in git history —
# reset it in the Neon dashboard (Project → Reset password) BEFORE deploying,
# then paste the fresh connection strings in the Blueprint wizard.
# ==============================================================================

services:
  - type: web
    name: banna-redshipping-api
    runtime: node
    plan: free
    region: frankfurt
    # Follows the repository default branch (main) automatically
    autoDeploy: true
    # Install → generate the Prisma client → build shared-types then the API
    buildCommand: npm ci && npm run -w apps/api db:generate && npx turbo run build --filter=@banna/api
    # Migrations + seed run against the DIRECT (non-pooled) Neon URL — Prisma
    # must not run migrations through a PgBouncer pooled connection.
    startCommand: DATABASE_URL="$DIRECT_DATABASE_URL" npm run -w apps/api db:deploy && DATABASE_URL="$DIRECT_DATABASE_URL" npm run -w apps/api db:seed ; node apps/api/dist/main.js
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      # ── Neon PostgreSQL (free forever, no credit card, autosuspends & wakes automatically) ──
      # POOLED connection string (host contains "-pooler") — used by the running API.
      - key: DATABASE_URL
        sync: false
      # DIRECT connection string (same URL WITHOUT "-pooler" in the host) —
      # used by `prisma migrate deploy` and the seed at boot.
      - key: DIRECT_DATABASE_URL
        sync: false
      # Auto-generated secrets — no manual setup required
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      # Optional: enable reminder/ACID queues (BullMQ). Uncomment this block AND
      # a keyvalue instance to activate. Without it the API runs in disabled-queue
      # mode and every other feature keeps working.
      # - key: REDIS_URL
      #   fromService:
      #     type: keyvalue
      #     name: banna-redshipping-redis
      #     property: connectionString
      # Optional live integrations — set from the Render dashboard when the
      # company credentials are available (until then the API answers honestly):
      # - key: ETA_ENV               # sit | production
      # - key: ETA_CLIENT_ID
      # - key: ETA_CLIENT_SECRET
      # - key: WHATSAPP_API_TOKEN
      # - key: WHATSAPP_PHONE_NUMBER_ID
      # Optional: custom frontend domain(s), comma separated, e.g.
      # https://redshipping.com,https://www.redshipping.com
      # - key: ALLOWED_ORIGINS
      #   sync: false
