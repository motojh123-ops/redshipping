version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: banna-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-banna_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-banna_secure_pass_2026}
      POSTGRES_DB: ${DB_NAME:-banna_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-banna_admin} -d ${DB_NAME:-banna_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: banna-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-banna_redis_pass}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-banna_redis_pass}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: banna-gotenberg
    restart: unless-stopped
    ports:
      - "${GOTENBERG_PORT:-3002}:3000"
    command:
      - "gotenberg"
      - "--chromium-disable-javascript=false"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: banna-uptime-kuma
    restart: unless-stopped
    ports:
      - "${UPTIME_KUMA_PORT:-3001}:3001"
    volumes:
      - uptime_kuma_data:/app/data

volumes:
  postgres_data:
  redis_data:
  uptime_kuma_data:
