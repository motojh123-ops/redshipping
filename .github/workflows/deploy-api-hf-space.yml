# ==============================================================================
# Deploy the NestJS API to a Hugging Face Space (Docker) ? a 100% FREE host
# (2 vCPU / 16 GB RAM, no credit card). Full Arabic guide: DEPLOYMENT.md.
#
# One-time setup ? GitHub ? Settings ? Secrets and variables ? Actions:
#   HF_TOKEN ? Hugging Face token with WRITE permission
#              (huggingface.co/settings/tokens ? New token ? role: write)
#   HF_SPACE ? <username>/<space-name>   e.g. jklk9579-cyber/red-shipping-api
#
# Create the Space once at huggingface.co/spaces:
#   Create new Space ? SDK: Docker ? name: red-shipping-api ? Create
# Then add the runtime variables (Settings ? Variables and secrets):
#   PORT=7860, NODE_ENV=production, SEED_DB=true,
#   DATABASE_URL (Neon POOLED url, port 443 ? HF only allows outbound 80/443/8080),
#   DIRECT_DATABASE_URL (Neon direct url, port 5432 ? used by migrations),
#   JWT_SECRET / JWT_REFRESH_SECRET (long random values)
#
# The workflow silently SKIPS (green) until HF_TOKEN & HF_SPACE are configured.
# ==============================================================================

name: Deploy API to Hugging Face Space

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "packages/shared-types/**"
      - ".github/workflows/deploy-api-hf-space.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ secrets.HF_TOKEN != '' && secrets.HF_SPACE != '' }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Log in to the Hugging Face container registry
        env:
          HF_SPACE: ${{ secrets.HF_SPACE }}
        run: echo "${{ secrets.HF_TOKEN }}" | docker login registry.hf.space -u "${HF_SPACE%%/*}" --password-stdin

      - name: Build the production API image (monorepo context)
        run: docker build -f apps/api/Dockerfile -t "registry.hf.space/${{ secrets.HF_SPACE }}:latest" .

      - name: Push image (the Space restarts automatically with it)
        run: docker push "registry.hf.space/${{ secrets.HF_SPACE }}:latest"
